# slf4j-simple configuration (read at classpath root on startup).
# Controls log output for every library in the JVM that uses slf4j.
# Reference: https://www.slf4j.org/api/org/slf4j/simple/SimpleLogger.html

# Default level for all packages not named below
org.slf4j.simpleLogger.defaultLogLevel=warn

# Timestamp in every log line (ISO-8601-friendly)
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Thread name useful for parallel="classes" debugging
org.slf4j.simpleLogger.showThreadName=true

# Short class name keeps lines readable
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# ── Suppress noisy third-party libraries ─────────────────────────────────────
org.slf4j.simpleLogger.log.com.microsoft.playwright=warn
org.slf4j.simpleLogger.log.io.qameta.allure=warn
org.slf4j.simpleLogger.log.org.testng=warn
org.slf4j.simpleLogger.log.com.aventstack=warn
org.slf4j.simpleLogger.log.io.netty=warn
org.slf4j.simpleLogger.log.org.apache=warn

# ── Toskie framework — INFO so infrastructure events surface in CI logs ───────
org.slf4j.simpleLogger.log.com.toskie=info
