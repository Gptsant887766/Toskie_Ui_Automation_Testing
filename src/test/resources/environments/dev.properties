# ── DEV environment — overlay on top of base config.properties ────────────────
# Loaded when -Denvironment=dev or env var ENVIRONMENT=dev
# Values here override matching keys in config.properties.
# Secrets (testMobile, testEmail, qaSecret, deviceId, fingerprint) must come
# from CI secret store — never commit them here.

environment=dev
baseUrl=https://dev.app.toskie.com/
apiUrl=https://toskie-api.wasd.in/graphql
headless=true
max.retries=3
slowMo=0
page.load.timeout=30000
