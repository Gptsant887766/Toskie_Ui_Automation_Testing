# ── PROD environment — overlay on top of base config.properties ───────────────
# Loaded when -Denvironment=prod or env var ENVIRONMENT=prod
# CRITICAL: Only smoke tests run against PROD (enforced by the prod Maven profile).
# Credentials must come from CI secrets — never commit prod secrets to source.

environment=prod
baseUrl=https://app.toskie.com/
apiUrl=https://api.toskie.com/graphql
headless=true
max.retries=0
slowMo=0
page.load.timeout=60000
